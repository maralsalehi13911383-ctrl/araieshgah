<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کافه ماچا | چت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --matcha:#8fae7e; --matcha-deep:#5f7f4f; --matcha-dark:#3d5a34;
  --mist:#eef4e8; --cream:#fbfdf8; --white:#fff; --ink:#2b3a27;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif; color:var(--ink);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  background:
    radial-gradient(circle at 15% 20%, #dcebd0 0, transparent 40%),
    radial-gradient(circle at 85% 80%, #cfe3c1 0, transparent 45%),
    var(--cream);
}
.card{
  width:100%; max-width:460px; height:min(680px,92vh); display:flex; flex-direction:column;
  background:var(--white); border-radius:32px 32px 32px 8px; overflow:hidden;
  box-shadow:0 20px 50px rgba(95,127,79,.22), 0 0 0 1px rgba(143,174,126,.25);
}
header{
  padding:22px 24px; color:var(--white); display:flex; align-items:center; gap:14px;
  background:linear-gradient(135deg,var(--matcha-deep),var(--matcha));
}
.logo{
  width:48px;height:48px;border-radius:50%;background:var(--white);
  display:grid;place-items:center;font-size:24px;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(255,255,255,.3);
}
header h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:1.5rem;letter-spacing:.5px}
header p{font-size:.78rem;opacity:.9;font-weight:300}
#chat{
  flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;
  background:linear-gradient(180deg,var(--mist),var(--white) 60%);
}
.msg{
  max-width:82%; padding:11px 16px; line-height:1.9; font-size:.93rem; white-space:pre-wrap;
  animation:pop .25s ease;
}
.bot{align-self:flex-start;background:var(--white);border:1px solid #d9e6cf;border-radius:20px 20px 20px 4px;}
.user{align-self:flex-end;color:var(--white);background:var(--matcha-deep);border-radius:20px 20px 4px 20px;}
.bot audio{display:block;margin-top:8px;height:34px;max-width:100%}
.typing{color:var(--matcha-deep);font-size:.85rem}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
form{display:flex;gap:10px;padding:14px 16px;background:var(--white);border-top:1px solid #e3edd9}
input{
  flex:1;border:1.5px solid #d3e2c7;background:var(--mist);border-radius:999px;
  padding:12px 18px;font:inherit;font-size:.93rem;color:var(--ink);outline:none;transition:.2s;
}
input:focus{border-color:var(--matcha-deep);background:var(--white);box-shadow:0 0 0 4px rgba(143,174,126,.25)}
button{
  border:0;border-radius:999px;padding:0 22px;font:inherit;font-weight:600;cursor:pointer;
  color:var(--white);background:var(--matcha-deep);transition:.2s;
}
button:hover{background:var(--matcha-dark)}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible{outline:3px solid var(--matcha);outline-offset:2px}
#chat::-webkit-scrollbar{width:6px}
#chat::-webkit-scrollbar-thumb{background:#c5d9b7;border-radius:6px}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="logo">🍵</div>
    <div>
      <h1>کافه ماچا</h1>
      <p>هر سوالی داری بپرس، ما اینجاییم</p>
    </div>
  </header>

  <div id="chat" aria-live="polite">
    <div class="msg bot">سلام! 🌿 چه کمکی میتونم بکنم؟</div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="پیامت رو بنویس..." autocomplete="off" required>
    <button id="send" type="submit">ارسال</button>
  </form>
</main>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addMsg(text, 'user');

  if(text === 'خداحافظ'){
    addMsg('درپناه حق 🌿', 'bot');
    return;
  }

  send.disabled = true;
  const wait = addMsg('در حال نوشتن...', 'bot typing');
  try{
    // آدرس سرور خودت (Flask) — کلید API فقط روی سرور میمونه
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text})
    });
    const data = await res.json();
    wait.classList.remove('typing');
    wait.textContent = data.reply;
    if(data.audio){
      const a = document.createElement('audio');
      a.controls = true;
      a.src = data.audio;
      wait.appendChild(a);
    }
  }catch(err){
    wait.classList.remove('typing');
    wait.textContent = 'ارتباط با سرور برقرار نشد. دوباره تلاش کن.';
  }
  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
  input.focus();
});
</script>
</body>
</html>
